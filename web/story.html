<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Amina's story · Selfpay</title>
<meta name="robots" content="noindex">
<link rel="preload" href="fonts/montserrat-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="story.css">
<style>
@font-face{font-family:"Montserrat";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/montserrat-latin-wght-normal.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:100 900;font-display:swap;src:url("fonts/inter-latin-opsz-normal.woff2") format("woff2")}
:root{--lime:#c8f169;--lime-hover:#d6f78a;--sun:#ffb629;--bad:#ff7a6b;--ink:#082a1b;--muted:#b9d8c5;--line:rgba(255,255,255,.22);--glass:rgba(255,255,255,.08);--glass-strong:rgba(255,255,255,.16);--font-display:"Montserrat","Inter",system-ui,sans-serif;--font-body:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#0c3b26;color:#fff;font:600 16px/1.4 var(--font-body);display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
.stage-wrap{flex:none;width:100%;aspect-ratio:16/9;border-radius:0}
body .ad{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px clamp(14px,3.4vw,26px) 12px;background:linear-gradient(180deg,#0c3b26,#082a1b);overflow:hidden}
body .ad-step{font:600 .75rem/1 var(--font-display);letter-spacing:.14em;color:var(--lime)}
body .ad-h{margin:6px 0 4px;min-height:0;font-size:clamp(1.2rem,4.8vw,2.1rem);line-height:1.1;font-weight:700}
body .ad-sub{margin:0;max-width:none;font-size:clamp(.9375rem,2.3vw,1.05rem);font-weight:500;color:#d3e8da;line-height:1.35}
.copy{min-height:0;overflow:hidden}
body .say{font:700 clamp(.8rem,2.4vw,.95rem)/1.2 var(--font-display);padding:7px 14px}
@media (max-width:900px){body .ad{padding:12px clamp(14px,3.4vw,26px)}body .ad-h{min-height:0}}
</style>
</head>
<body>
<div class="stage-wrap" id="stageWrap" data-scene="1">
        <svg class="stage-svg" id="stage" data-scene="1" data-mood="smile" viewBox="0 0 800 450" aria-hidden="true" focusable="false">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fc3ff"/><stop offset="1" stop-color="#e3f4ff"/></linearGradient>
            <g id="coin"><circle r="8" fill="#f5c518" stroke="#c99a00" stroke-width="2"/><text y="3.6" text-anchor="middle" font-size="10" font-weight="700" fill="#8a6500">$</text></g>
            <g id="coinB"><circle r="8" fill="#7cc3ff" stroke="#2f7fc4" stroke-width="2"/><text y="3.6" text-anchor="middle" font-size="10" font-weight="700" fill="#1d5b94">$</text></g>
            <g id="unit">
              <rect x="-26" y="-30" width="52" height="30" rx="6" fill="#2c5fd6" stroke="#173a8a" stroke-width="3"/>
              <path d="M-4 -26 L-10 -14 H-2 L-6 -4 L8 -18 H0 L4 -26Z" fill="#f5c518"/>
              <path d="M-34 -34 L-22 -66 H34 L22 -34Z" fill="#1d4fb3" stroke="#0e2d70" stroke-width="3" stroke-linejoin="round"/>
              <path d="M-28 -50 H28 M-3 -66 L-9 -34 M15 -66 L9 -34" stroke="#9cc7ff" stroke-width="1.6" fill="none"/>
              <circle cx="18" cy="-15" r="4.5" style="fill:var(--lamp,#86d13f)" stroke="#173a8a" stroke-width="1.5"/>
            </g>
            <g id="vault">
              <rect x="-38" y="-70" width="76" height="70" rx="10" fill="#1fa39a" stroke="#0d6e68" stroke-width="3"/>
              <rect x="-22" y="-60" width="44" height="8" rx="4" fill="#0b4f4b"/>
              <circle cx="0" cy="-27" r="15" fill="#fff" stroke="#0d6e68" stroke-width="3"/>
              <path d="M0 -37 V-27 H8" stroke="#0d6e68" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
            <g id="jar">
              <rect x="-44" y="-90" width="88" height="90" rx="14" fill="#cfe8ff" fill-opacity=".6" stroke="#3c8fd6" stroke-width="3"/>
              <rect x="-48" y="-98" width="96" height="12" rx="6" fill="#3c8fd6"/>
              <use href="#coinB" x="-24" y="-12"/><use href="#coinB" x="0" y="-12"/><use href="#coinB" x="24" y="-12"/><use href="#coinB" x="-12" y="-29"/><use href="#coinB" x="12" y="-29"/>
            </g>
            <g id="padlock">
              <path d="M-12 -24 V-34 a12 12 0 0 1 24 0 V-24" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round"/>
              <rect x="-18" y="-26" width="36" height="28" rx="7" fill="#ef4444" stroke="#9b1c1c" stroke-width="2.5"/>
              <circle cx="0" cy="-12" r="4" fill="#fff"/>
            </g>
            <g id="person">
              <ellipse cy="2" rx="22" ry="5" fill="#000" opacity=".12"/>
              <rect x="-12" y="-36" width="10" height="36" rx="4" fill="#2b2b3a"/><rect x="2" y="-36" width="10" height="36" rx="4" fill="#2b2b3a"/>
              <rect x="-20" y="-88" width="40" height="56" rx="14" style="fill:var(--top,#e24b6a)"/>
              <circle cy="-104" r="18" style="fill:var(--skin,#c68642)"/>
              <path d="M-18 -108 Q-14 -126 0 -126 Q14 -126 18 -108 Q8 -116 0 -116 Q-8 -116 -18 -108Z" style="fill:var(--hair,#2b1d14)"/>
              <circle cx="-6" cy="-104" r="2.4" fill="#1d1b19"/><circle cx="6" cy="-104" r="2.4" fill="#1d1b19"/>
              <path d="M-6 -96 Q0 -91 6 -96" stroke="#3a1c10" stroke-width="2.2" fill="none" stroke-linecap="round"/>
            </g>
            <g id="amina">
              <ellipse cy="2" rx="34" ry="6" fill="#000" opacity=".12"/>
              <rect x="-16" y="-46" width="12" height="46" rx="5" fill="#3a2a22"/><rect x="4" y="-46" width="12" height="46" rx="5" fill="#3a2a22"/>
              <path d="M-30 -48 Q-34 -112 -18 -118 H18 Q34 -112 30 -48 Z" fill="#f5c518"/>
              <path d="M-31 -82 H31 V-72 H-31Z" fill="#86d13f"/>
              <path class="arm-l" d="M-26 -108 Q-48 -90 -42 -66" stroke="#8a5a3c" stroke-width="10" stroke-linecap="round" fill="none"/>
              <path class="arm-r" d="M26 -108 Q48 -90 42 -66" stroke="#8a5a3c" stroke-width="10" stroke-linecap="round" fill="none"/>
              <circle cy="-138" r="27" fill="#8a5a3c"/>
              <path d="M-29 -146 Q-24 -178 0 -178 Q24 -178 29 -146 Q14 -160 0 -160 Q-14 -160 -29 -146Z" fill="#e24b6a"/>
              <circle cx="22" cy="-168" r="8" fill="#e24b6a"/>
              <g class="eyes"><circle cx="-9" cy="-138" r="3.3" fill="#1d1b19"/><circle cx="9" cy="-138" r="3.3" fill="#1d1b19"/></g>
              <circle cx="-17" cy="-128" r="4" fill="#ff9aa2" opacity=".7"/><circle cx="17" cy="-128" r="4" fill="#ff9aa2" opacity=".7"/>
              <path d="M-10 -126 Q0 -116 10 -126" stroke="#3a1c10" stroke-width="2.8" fill="none" stroke-linecap="round" style="opacity:var(--smile,1)"/>
              <path d="M-8 -120 Q0 -128 8 -120" stroke="#3a1c10" stroke-width="2.8" fill="none" stroke-linecap="round" style="opacity:var(--worry,0)"/>
              <ellipse cx="0" cy="-122" rx="4.5" ry="5.5" fill="#3a1c10" style="opacity:var(--wow,0)"/>
            </g>
          </defs>

          <!-- backdrop shared by every scene -->
          <rect width="800" height="450" fill="url(#sky)"/>
          <g class="sun"><circle cx="716" cy="66" r="28" fill="#ffd84a"/><g class="sun-rays" stroke="#ffd84a" stroke-width="5" stroke-linecap="round"><path d="M716 18v-10M716 114v10M668 66h-10M764 66h10M682 32l-7-7M750 100l7 7M750 32l7-7M682 100l-7 7"/></g></g>
          <g class="cloud c1"><path d="M60 92 q0-22 24-22 q8-18 32-12 q26-6 32 18 q22 0 22 20 H50 q-10-2-10-4Z" fill="#fff" opacity=".9"/></g>
          <g class="cloud c2"><path d="M420 54 q0-18 20-18 q8-14 26-10 q22-4 26 16 q18 0 18 16 H412 q-8-2-8-4Z" fill="#fff" opacity=".85"/></g>
          <rect y="352" width="800" height="98" fill="#5cbb48"/><rect y="352" width="800" height="10" fill="#4aa63a"/>

          <!-- 1 · Meet Amina -->
          <g class="sc s1">
            <g transform="translate(520 352)">
              <rect x="-125" y="-125" width="250" height="125" rx="8" fill="#f3e2c3" stroke="#b58b4c" stroke-width="3"/>
              <path d="M-138 -125 H138 L124 -158 H-124Z" fill="#e24b6a"/>
              <path d="M-92 -125 L-82 -158 H-46 L-54 -125Z M-18 -125 L-10 -158 H26 L18 -125Z M56 -125 L62 -158 H98 L90 -125Z" fill="#ffb3c1"/>
              <rect x="-72" y="-112" width="144" height="24" rx="7" fill="#0a2f73"/><text y="-95" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">SOLAR RENTALS</text>
              <use href="#unit" x="-68" y="-8"/><use href="#unit" x="0" y="-8"/><use href="#unit" x="68" y="-8"/>
            </g>
            <g transform="translate(170 352) scale(1.15)"><use href="#amina"/></g>
            <g class="walk-in" transform="translate(340 352)"><use href="#person" style="--top:#7a5cff;--skin:#e0ac69"/></g>
            <g transform="translate(375 270)"><use href="#coin" class="fly" style="--dx:120px;--dy:-26px;animation-delay:0.6s"/></g>
            <g transform="translate(375 270)"><use href="#coin" class="fly" style="--dx:120px;--dy:-26px;animation-delay:1.45s"/></g>
            <g transform="translate(375 270)"><use href="#coin" class="fly" style="--dx:120px;--dy:-26px;animation-delay:2.3s"/></g>
          </g>

          <!-- 2 · She wants to grow, the bank says no -->
          <g class="sc s2">
            <g transform="translate(120 352) scale(1.15)"><use href="#amina"/></g>
            <g class="thought"><ellipse cx="270" cy="150" rx="118" ry="64" fill="#fff" stroke="#c9d8ee" stroke-width="3"/><circle cx="188" cy="226" r="9" fill="#fff" stroke="#c9d8ee" stroke-width="3"/><circle cx="172" cy="250" r="5" fill="#fff" stroke="#c9d8ee" stroke-width="3"/>
              <g transform="translate(206 150) scale(.3)"><use class="pop" style="animation-delay:0.2s" href="#unit"/></g><g transform="translate(240 150) scale(.3)"><use class="pop" style="animation-delay:0.3s" href="#unit"/></g><g transform="translate(274 150) scale(.3)"><use class="pop" style="animation-delay:0.4s" href="#unit"/></g><g transform="translate(308 150) scale(.3)"><use class="pop" style="animation-delay:0.5s" href="#unit"/></g><g transform="translate(342 150) scale(.3)"><use class="pop" style="animation-delay:0.6s" href="#unit"/></g>
              <g transform="translate(206 186) scale(.3)"><use class="pop" style="animation-delay:0.7s" href="#unit"/></g><g transform="translate(240 186) scale(.3)"><use class="pop" style="animation-delay:0.8s" href="#unit"/></g><g transform="translate(274 186) scale(.3)"><use class="pop" style="animation-delay:0.9s" href="#unit"/></g><g transform="translate(308 186) scale(.3)"><use class="pop" style="animation-delay:1s" href="#unit"/></g><g transform="translate(342 186) scale(.3)"><use class="pop" style="animation-delay:1.1s" href="#unit"/></g>
              <text x="270" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2f73">10 more units!</text></g>
            <g transform="translate(620 352)">
              <rect x="-95" y="-150" width="190" height="150" fill="#ece5d6" stroke="#9c8a6a" stroke-width="3"/>
              <path d="M-108 -150 L0 -206 L108 -150Z" fill="#8a6f4d" stroke="#6b5539" stroke-width="3" stroke-linejoin="round"/>
              <rect x="-72" y="-130" width="18" height="110" fill="#fff" stroke="#c9bfa8" stroke-width="2"/><rect x="-30" y="-130" width="18" height="110" fill="#fff" stroke="#c9bfa8" stroke-width="2"/><rect x="12" y="-130" width="18" height="110" fill="#fff" stroke="#c9bfa8" stroke-width="2"/><rect x="54" y="-130" width="18" height="110" fill="#fff" stroke="#c9bfa8" stroke-width="2"/>
              <rect x="-40" y="-186" width="80" height="22" rx="5" fill="#0a2f73"/><text y="-170" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">BANK</text>
            </g>
            <g transform="translate(620 120)"><g class="stamp"><circle r="28" fill="#ef4444" stroke="#fff" stroke-width="4"/><path d="M-11 -11 L11 11 M11 -11 L-11 11" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g></g>
            <g transform="translate(540 290)"><rect class="fly" style="--dx:-190px;--dy:-30px;animation-delay:0.7s" x="-9" y="-12" width="18" height="24" rx="2" fill="#fff" stroke="#9aa8c4" stroke-width="2"/></g>
            <g transform="translate(540 290)"><rect class="fly" style="--dx:-190px;--dy:-30px;animation-delay:1.3s" x="-9" y="-12" width="18" height="24" rx="2" fill="#fff" stroke="#9aa8c4" stroke-width="2"/></g>
            <g transform="translate(540 290)"><rect class="fly" style="--dx:-190px;--dy:-30px;animation-delay:1.9s" x="-9" y="-12" width="18" height="24" rx="2" fill="#fff" stroke="#9aa8c4" stroke-width="2"/></g>
          </g>

          <!-- 3 · Enter Selfpay -->
          <g class="sc s3">
            <g transform="translate(120 352) scale(.85)"><use href="#person" style="--top:#2f7fe0;--skin:#8a5a3c"/></g>
            <g transform="translate(205 352) scale(.85)"><use href="#person" style="--top:#f08a24;--skin:#e0ac69"/></g>
            <g transform="translate(290 352) scale(.85)"><use href="#person" style="--top:#a259ff;--skin:#c68642;--hair:#111"/></g>
            <g transform="translate(205 128)"><circle r="30" fill="#3c8fd6" stroke="#1d5b94" stroke-width="3"/><path d="M-30 0 H30 M0 -30 V30 M-22 -20 Q0 -8 22 -20 M-22 20 Q0 8 22 20" stroke="#cfe8ff" stroke-width="2.4" fill="none"/><circle r="30" fill="none" stroke="#cfe8ff" stroke-width="2.4" stroke-dasharray="3 5"/></g>
            <text x="205" y="182" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2f73">Lenders worldwide</text>
            <g transform="translate(560 352) scale(1.45)"><use href="#jar"/></g>
            <text x="560" y="196" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2f73">Selfpay pool</text>
            <g transform="translate(150 250)"><use href="#coinB" class="fly arc" style="--dx:370px;--dy:30px;animation-delay:0.3s"/></g>
            <g transform="translate(205 250)"><use href="#coinB" class="fly arc" style="--dx:320px;--dy:30px;animation-delay:0.8s"/></g>
            <g transform="translate(260 250)"><use href="#coinB" class="fly arc" style="--dx:270px;--dy:30px;animation-delay:1.3s"/></g>
            <g transform="translate(150 250)"><use href="#coinB" class="fly arc" style="--dx:370px;--dy:30px;animation-delay:1.8s"/></g>
            <g transform="translate(205 250)"><use href="#coinB" class="fly arc" style="--dx:320px;--dy:30px;animation-delay:2.3s"/></g>
            <g transform="translate(710 352) scale(1.05)"><use href="#amina"/></g>
          </g>

          <!-- 4 · Every unit gets its own vault -->
          <g class="sc s4">
            <g transform="translate(330 352) scale(1.5)"><use href="#unit"/></g>
            <path d="M372 322 C412 322 426 322 470 322" stroke="#3a4668" stroke-width="5" fill="none" stroke-dasharray="7 6"/>
            <g transform="translate(520 352) scale(1.25)"><use href="#vault"/></g>
            <circle class="pulse" cx="520" cy="296" r="58" fill="none" stroke="#86d13f" stroke-width="4"/>
            <text x="520" y="204" text-anchor="middle" font-size="14" font-weight="700" fill="#0a2f73">The unit's own vault</text>
            <g transform="translate(120 352)"><use href="#person" style="--top:#7a5cff;--skin:#e0ac69"/></g>
            <text x="120" y="212" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2f73">Customer pays here →</text>
            <g transform="translate(150 270)"><use href="#coin" class="fly arc" style="--dx:370px;--dy:-6px;animation-delay:0.4s"/></g>
            <g transform="translate(150 270)"><use href="#coin" class="fly arc" style="--dx:370px;--dy:-6px;animation-delay:1.4s"/></g>
            <g transform="translate(150 270)"><use href="#coin" class="fly arc" style="--dx:370px;--dy:-6px;animation-delay:2.4s"/></g>
            <g transform="translate(704 352) scale(1.05)"><use href="#amina"/></g>
          </g>

          <!-- 5 · Borrow against real earnings -->
          <g class="sc s5">
            <g transform="translate(110 352) scale(1.15)"><use href="#jar"/></g>
            <text x="110" y="228" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2f73">Lender pool</text>
            <g transform="translate(360 352) scale(1.15)"><use href="#amina"/></g>
            <g transform="translate(150 285)"><use href="#coinB" class="fly arc" style="--dx:180px;--dy:-30px;animation-delay:0.25s"/></g>
            <g transform="translate(150 285)"><use href="#coinB" class="fly arc" style="--dx:180px;--dy:-30px;animation-delay:0.55s"/></g>
            <g transform="translate(150 285)"><use href="#coinB" class="fly arc" style="--dx:180px;--dy:-30px;animation-delay:0.85s"/></g>
            <g transform="translate(150 285)"><use href="#coinB" class="fly arc" style="--dx:180px;--dy:-30px;animation-delay:1.15s"/></g>
            <g transform="translate(540 352) scale(1.1)"><use href="#unit"/></g>
            <g transform="translate(610 352) scale(1.1)"><use href="#unit"/></g>
            <g transform="translate(680 352) scale(1.1)"><use class="pop" style="animation-delay:1.3s" href="#unit"/></g>
            <g transform="translate(750 352) scale(1.1)"><use class="pop" style="animation-delay:1.55s" href="#unit"/></g>
            <text x="645" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#0a2f73">More units, more income</text>
          </g>

          <!-- 6 · The loan pays itself back -->
          <g class="sc s6">
            <g transform="translate(100 352)"><use href="#person" style="--top:#7a5cff;--skin:#e0ac69"/></g>
            <g transform="translate(330 352) scale(1.3)"><use href="#vault"/></g>
            <g transform="translate(560 352) scale(.95)"><use href="#amina"/></g>
            <g transform="translate(712 352) scale(1.1)"><use href="#jar"/></g>
            <g transform="translate(130 272)"><use href="#coin" class="fly arc" style="--dx:200px;--dy:-4px;animation-delay:0.25s"/></g>
            <g transform="translate(130 272)"><use href="#coin" class="fly arc" style="--dx:200px;--dy:-4px;animation-delay:1.7s"/></g>
            <g transform="translate(360 262)"><use href="#coinB" class="fly arc" style="--dx:320px;--dy:-10px;animation-delay:0.85s"/></g>
            <g transform="translate(360 262)"><use href="#coinB" class="fly arc" style="--dx:320px;--dy:-10px;animation-delay:2.3s"/></g>
            <g transform="translate(360 290)"><use href="#coin" class="fly arc" style="--dx:170px;--dy:-24px;animation-delay:1.05s"/></g>
            <g transform="translate(360 290)"><use href="#coin" class="fly arc" style="--dx:170px;--dy:-24px;animation-delay:2.5s"/></g>
            <text x="520" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7fc4">Lender first</text>
            <text x="560" y="168" text-anchor="middle" font-size="13" font-weight="700" fill="#8a6500">Amina keeps the rest</text>
          </g>

          <!-- 7 · If payments stop, the unit locks -->
          <g class="sc s7">
            <g transform="translate(110 130)"><rect x="-44" y="-36" width="88" height="80" rx="10" fill="#fff" stroke="#c9d8ee" stroke-width="3"/><rect x="-44" y="-36" width="88" height="24" rx="10" fill="#ef4444"/><text y="-19" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">DAY 8</text><text y="22" text-anchor="middle" font-size="22" font-weight="700" fill="#ef4444" class="late">LATE</text></g>
            <g class="walk-away" transform="translate(110 352)"><use href="#person" style="--top:#7a5cff;--skin:#e0ac69"/></g>
            <g transform="translate(260 352) scale(1.5)"><use href="#unit" style="--lamp:#5b6577;filter:grayscale(1) brightness(.7)"/></g>
            <g transform="translate(260 290)"><g class="lock-in"><use href="#padlock" transform="scale(1.5)"/></g></g>
            <g transform="translate(400 352)"><use href="#amina"/></g>
            <g transform="translate(540 352) scale(1.2)"><use href="#vault"/></g>
            <g transform="translate(712 352) scale(1.1)"><use href="#jar"/></g>
            <g transform="translate(555 262)"><use href="#coinB" class="fly arc" style="--dx:155px;--dy:-4px;animation-delay:0.6s"/></g>
            <g transform="translate(555 262)"><use href="#coinB" class="fly arc" style="--dx:155px;--dy:-4px;animation-delay:1.2s"/></g>
            <g transform="translate(555 262)"><use href="#coinB" class="fly arc" style="--dx:155px;--dy:-4px;animation-delay:1.8s"/></g>
            <text x="630" y="190" text-anchor="middle" font-size="13" font-weight="700" fill="#2f7fc4">All revenue → lender</text>
          </g>

          <!-- 8 · Catch up and it switches back on -->
          <g class="sc s8">
            <g transform="translate(240 352) scale(1.5)"><use href="#unit"/></g>
            <g transform="translate(240 290)"><g class="unlock"><path d="M-12 -24 V-34 a12 12 0 0 1 24 0 V-30" fill="none" stroke="#ef4444" stroke-width="7" stroke-linecap="round" transform="scale(1.5)"/><rect x="-27" y="-39" width="54" height="42" rx="10" fill="#ef4444" stroke="#9b1c1c" stroke-width="3"/></g></g>
            <g transform="translate(400 352)"><use href="#amina"/></g>
            <g transform="translate(540 352) scale(1.2)"><use href="#vault"/></g>
            <g transform="translate(712 352) scale(1.1)"><use href="#jar"/></g>
            <g transform="translate(440 262)"><use href="#coin" class="fly arc" style="--dx:100px;--dy:0px;animation-delay:0.3s"/></g>
